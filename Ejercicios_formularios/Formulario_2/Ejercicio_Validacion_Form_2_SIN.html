<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Validación de formulario</title>

    <script src="Utilidades.js"></script>

    <script>

        window.onload = function () {

            //Ponemos el foco en el nombre al cargar la pagina.
            document.getElementById("nombre").focus();


            document.getElementById("formulario_1").onsubmit = function (evento) {

                let correcto = true;


                //Validamos el nombre
                let errorNombre = validarNombre(document.getElementById("nombre"));
                document.getElementById("info_nombre").innerHTML = errorNombre;

                if (errorNombre !== "") {
                    correcto = false;
                }


                //Validamos los apellidos
                let errorApellidos = validarApellidos(document.getElementById("apellidos"));
                document.getElementById("info_apellidos").innerHTML = errorApellidos;

                if (errorApellidos !== "") {
                    correcto = false;
                }


                //Validamos el NIF
                let errorNif = validarNIF(document.getElementById("dni"));
                document.getElementById("info_dni").innerHTML = errorNif;

                if (errorNif !== "") {
                    correcto = false;
                }


                //Validamos el sexo
                let errorSexo = validarSexo(document.getElementsByName("sexo"));
                document.getElementById("info_sexo").innerHTML = errorSexo;

                if (errorSexo !== "") {
                    correcto = false;
                }


                //Validamos la fecha
                let errorFecha = validarFecha(
                    document.getElementById("f_dia"),
                    document.getElementById("f_mes"),
                    document.getElementById("f_ano")
                );

                document.getElementById("info_fecha").innerHTML = errorFecha;

                if (errorFecha !== "") {
                    correcto = false;
                }


                //Validamos la estatura
                let errorEstatura = validarEstatura(
                    document.getElementById("estatura")
                );

                document.getElementById("info_estatura").innerHTML = errorEstatura;

                if (errorEstatura !== "") {
                    correcto = false;
                }


                //Validamos el estado civil
                let errorEstadoCivil = validarEstadoCivil(
                    document.getElementById("estado_civil")
                );

                document.getElementById("info_estado_civil").innerHTML = errorEstadoCivil;

                if (errorEstadoCivil !== "") {
                    correcto = false;
                }


                //Validamos las bebidas
                let errorBebidas = validarBebidas(
                    document.getElementsByName("bebidas")
                );

                document.getElementById("info_bebidas").innerHTML = errorBebidas;

                if (errorBebidas !== "") {
                    correcto = false;
                }


                //Validamos la cuenta corriente
                let errorCCC = validarCCC(
                    document.getElementById("ccc")
                );

                document.getElementById("info_ccc").innerHTML = errorCCC;

                if (errorCCC !== "") {
                    correcto = false;
                }


                //Validamos la sugerencia
                let errorSugerencia = validarSugerencia(
                    document.getElementById("sugerencia")
                );

                document.getElementById("info_sugerencia").innerHTML = errorSugerencia;

                if (errorSugerencia !== "") {
                    correcto = false;
                }


                //Si hay algun error, no dejamos enviar el formulario.
                if (!correcto) {
                    evento.preventDefault();
                }
            };


            //Al pulsar Limpiar eliminamos todos los mensajes de error.
            document.getElementById("formulario_1").onreset = function () {

                document.getElementById("info_nombre").innerHTML = "";
                document.getElementById("info_apellidos").innerHTML = "";
                document.getElementById("info_dni").innerHTML = "";
                document.getElementById("info_sexo").innerHTML = "";
                document.getElementById("info_fecha").innerHTML = "";
                document.getElementById("info_estatura").innerHTML = "";
                document.getElementById("info_estado_civil").innerHTML = "";
                document.getElementById("info_bebidas").innerHTML = "";
                document.getElementById("info_ccc").innerHTML = "";
                document.getElementById("info_sugerencia").innerHTML = "";
            };


            //Al escribir en el nombre quitamos el mensaje de error.
            document.getElementById("nombre").oninput = function () {
                document.getElementById("info_nombre").innerHTML =
                    validarNombre(document.getElementById("nombre"));
            };


            //Al escribir en los apellidos quitamos el mensaje de error.
            document.getElementById("apellidos").oninput = function () {
                document.getElementById("info_apellidos").innerHTML =
                    validarApellidos(document.getElementById("apellidos"));
            };


            //Al escribir en el NIF quitamos el mensaje de error.
            document.getElementById("dni").oninput = function () {
                document.getElementById("info_dni").innerHTML =
                    validarNIF(document.getElementById("dni"));
            };


            //Al seleccionar el sexo quitamos el mensaje de error.
            let sexos = document.getElementsByName("sexo");

            for (let i = 0; i < sexos.length; i++) {

                sexos[i].onchange = function () {
                    document.getElementById("info_sexo").innerHTML =
                        validarSexo(document.getElementsByName("sexo"));
                };
            }


            //Al escribir la fecha quitamos el mensaje de error.
            document.getElementById("f_dia").oninput = function () {
                document.getElementById("info_fecha").innerHTML =
                    validarFecha(
                        document.getElementById("f_dia"),
                        document.getElementById("f_mes"),
                        document.getElementById("f_ano")
                    );
            };

            document.getElementById("f_mes").oninput = function () {
                document.getElementById("info_fecha").innerHTML =
                    validarFecha(
                        document.getElementById("f_dia"),
                        document.getElementById("f_mes"),
                        document.getElementById("f_ano")
                    );
            };

            document.getElementById("f_ano").oninput = function () {
                document.getElementById("info_fecha").innerHTML =
                    validarFecha(
                        document.getElementById("f_dia"),
                        document.getElementById("f_mes"),
                        document.getElementById("f_ano")
                    );
            };


            //Al escribir la estatura quitamos el mensaje de error.
            document.getElementById("estatura").oninput = function () {
                document.getElementById("info_estatura").innerHTML =
                    validarEstatura(document.getElementById("estatura"));
            };


            //Al seleccionar el estado civil quitamos el mensaje de error.
            document.getElementById("estado_civil").onchange = function () {
                document.getElementById("info_estado_civil").innerHTML =
                    validarEstadoCivil(document.getElementById("estado_civil"));
            };


            //Al seleccionar las bebidas quitamos el mensaje de error.
            let bebidas = document.getElementsByName("bebidas");

            for (let i = 0; i < bebidas.length; i++) {

                bebidas[i].onchange = function () {
                    document.getElementById("info_bebidas").innerHTML =
                        validarBebidas(document.getElementsByName("bebidas"));
                };
            }


            //Al escribir la cuenta corriente quitamos el mensaje de error.
            document.getElementById("ccc").oninput = function () {
                document.getElementById("info_ccc").innerHTML =
                    validarCCC(document.getElementById("ccc"));
            };


            //Al escribir la sugerencia quitamos el mensaje de error.
            document.getElementById("sugerencia").oninput = function () {
                document.getElementById("info_sugerencia").innerHTML =
                    validarSugerencia(document.getElementById("sugerencia"));
            };

        };

    </script>
</head>


<body>

    <h1>Formulario de validación - Ejercicio 2</h1>


    <form id="formulario_1">


        <!-- Nombre -->
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
        <span id="info_nombre"></span>

        <br><br>


        <!-- Apellidos -->
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos">
        <span id="info_apellidos"></span>

        <br><br>


        <!-- NIF -->
        <label for="dni">NIF:</label>
        <input type="text" id="dni" name="dni">
        <span id="info_dni"></span>

        <br><br>


        <!-- Sexo -->
        <p>Sexo:</p>

        <input type="radio" name="sexo" id="masculino" value="masculino">
        <label for="masculino">Masculino</label>

        <input type="radio" name="sexo" id="femenino" value="femenino">
        <label for="femenino">Femenino</label>

        <input type="radio" name="sexo" id="ni_me_acuerdo" value="ni_me_acuerdo">
        <label for="ni_me_acuerdo">Ni me acuerdo</label>

        <span id="info_sexo"></span>

        <br><br>


        <!-- Fecha -->
        <label>Fecha:</label>

        <input type="text" id="f_dia" name="f_dia" size="2">
        /
        <input type="text" id="f_mes" name="f_mes" size="2">
        /
        <input type="text" id="f_ano" name="f_ano" size="4">

        <span id="info_fecha"></span>

        <br><br>


        <!-- Estatura -->
        <label for="estatura">Estatura (metros):</label>
        <input type="text" id="estatura" name="estatura">

        <span id="info_estatura"></span>

        <br><br>


        <!-- Estado civil -->
        <label for="estado_civil">Estado civil:</label>

        <select id="estado_civil" name="estado_civil">

            <option value="-1">Selecciona una opción</option>
            <option value="soltero">Soltero/a</option>
            <option value="casado">Casado/a</option>
            <option value="divorciado">Divorciado/a</option>
            <option value="viudo">Viudo/a</option>

        </select>

        <span id="info_estado_civil"></span>

        <br><br>


        <!-- Cervezas -->
        <p>Cervezas:</p>

        <input type="checkbox" name="bebidas" id="cerveza1" value="cerveza1">
        <label for="cerveza1">Cerveza 1</label>

        <input type="checkbox" name="bebidas" id="cerveza2" value="cerveza2">
        <label for="cerveza2">Cerveza 2</label>

        <input type="checkbox" name="bebidas" id="cerveza3" value="cerveza3">
        <label for="cerveza3">Cerveza 3</label>

        <input type="checkbox" name="bebidas" id="cerveza4" value="cerveza4">
        <label for="cerveza4">Cerveza 4</label>

        <input type="checkbox" name="bebidas" id="cerveza5" value="cerveza5">
        <label for="cerveza5">Cerveza 5</label>

        <span id="info_bebidas"></span>

        <br><br>


        <!-- Cuenta corriente -->
        <label for="ccc">Cuenta corriente:</label>
        <input type="text" id="ccc" name="ccc">

        <span id="info_ccc"></span>

        <br><br>


        <!-- Sugerencia -->
        <label for="sugerencia">Sugerencia:</label>

        <textarea id="sugerencia" name="sugerencia"></textarea>

        <span id="info_sugerencia"></span>

        <br><br>


        <!-- Botones -->
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">


    </form>

</body>

</html>
