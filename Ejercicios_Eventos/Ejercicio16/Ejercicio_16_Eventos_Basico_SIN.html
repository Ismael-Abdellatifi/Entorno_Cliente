<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://w3.org">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Ejercicio 16 - Zonas de la pantalla</title>
    <style type="text/css">

        body {
            font-family: arial, helvetica;
            margin: 0;
            padding: 0;
        }
        /* Cuadro de información fijo en la esquina superior izquierda.
           position: fixed hace que no se mueva aunque se haga scroll */
        #info {
            width: 200px;
            border: thin solid silver;
            padding: .5em;
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: #fcfcfc;
        }
        #info h1 {
            margin: 0;
            font-size: 1.1em;
        }
    </style>
    <script type="text/javascript">

        // TU CÓDIGO JAVASCRIPT DEBE IR AQUÍ

        //  Devuelve un array ancho y alto con el tamaño
        // de la ventana. Usa varias propiedades encadenadas con || para
        // que funcione tanto en navegadores modernos como en antiguos .
        function tamanoVentanaNavegador() {
            var ancho = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
            var alto = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
            return [ancho, alto];
        }


        function examinaPantalla(elEvento) {
            // Pista 1: Obtén las coordenadas del clic con elEvento.clientX y elEvento.clientY
            // Pista 2: Para saber las dimensiones de la ventana usa window.innerWidth y window.innerHeight
            // (o document.body.clientWidth / clientHeight si necesitas compatibilidad antigua)

            // Compatibilidad en navegadores antiguos el evento no llega
            // como parámetro, sino en window.event
            var evento = elEvento || window.event;

            // Obtenemos el tamaño de la ventana llamando a la función auxiliar
            var tamano = tamanoVentanaNavegador();
            var ancho = tamano[0];
            var alto = tamano[1];

            // Coordenadas del clic con  las ventanas visibles
            var x = evento.clientX;
            var y = evento.clientY;

            // Si el clic está en la mitad superior de la ventana (y menor
            // que alto/2) es "arriba"; si no, "abajo". Igual con x para
            // izquierda/derecha. Se usa el operador ternario (condición ? si : no).
            var vertical = (y < alto / 2) ? "arriba" : "abajo";
            var horizontal = (x < ancho / 2) ? "izquierda" : "derecha";

            // Reescribimos el contenido del cuadro de información
            // con la zona detectada, la posición del clic y el tamaño.
            document.getElementById("info").innerHTML =
                "<h1>Zonas de pantalla</h1>" +
                "<p>Has pulsado en la zona: <strong>" + horizontal + " " + vertical + "</strong></p>" +
                "<p>Posición del clic: [" + x + ", " + y + "]</p>" +
                "<p>Tamaño de la ventana: [" + ancho + ", " + alto + "]</p>";
        }

        // Cuando la página termina de cargar, asignamos el controlador.
        //y examina toda la pantalla
        window.onload = function() {
            document.onclick = examinaPantalla;
        }

    </script>
</head>
<body>

<div id="info">
    <h1>Zonas de pantalla</h1>
    <p>Haz clic en cualquier parte de la ventana para averiguar en qué cuadrante estás pulsando.</p>
</div>
</body>
</html>
